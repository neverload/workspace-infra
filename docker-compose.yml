name: workspace-infra

services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mongodb:
    image: mongo:7
    container_name: mongo
    environment:
      MONGO_INITDB_DATABASE: workspace_infra
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1G
    networks:
      - dev-network

  # ~/.local 数据卷：若 workspace_infra_dev_data 为空而 docker-env_dev-data 里有旧数据，下面用 external 挂旧卷名（见 volumes 段）。
  dev:
    build: ./dev
    container_name: dev
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    command: ["/usr/sbin/sshd", "-D", "-e", "-p", "2201"]
    volumes:
      - /home/admin/shared:/home/admin/shared
      - dev-data:/home/admin/.local

  prod:
    build: ./prod
    container_name: prod
    restart: unless-stopped
    network_mode: host
    command: ["/usr/sbin/sshd", "-D", "-e", "-p", "2202"]
    volumes:
      - /home/admin/shared:/home/admin/shared
      - prod-data:/home/admin/.local
    runtime: nvidia

volumes:
  caddy_data:
    name: workspace_infra_caddy_data
  caddy_config:
    name: workspace_infra_caddy_config
  mongodb_data:
    name: workspace_infra_mongodb_data
  # 曾用 compose project `docker-env` 时创建的卷名；与当前 `name: workspace_infra` 并存时空卷不会被用到。
  dev-data:
    external: true
    name: docker-env_dev-data
  prod-data:
    external: true
    name: docker-env_prod-data

networks:
  dev-network:
    driver: bridge
