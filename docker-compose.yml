name: workspace-infra

services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mongodb:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

  postgre:
    image: postgres:16
    container_name: postgre
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgre_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  dev:
    build: .
    image: workspace-infra/dev:latest
    container_name: dev
    restart: unless-stopped
    network_mode: host
    environment:
      RUN_GIT_SYNC: "1"
    command: ["/bin/bash", "/usr/local/bin/workspace-infra-entrypoint.sh", "2201"]
    volumes:
      - work-data:/home/admin/work
      - ./.env:/etc/workspace-infra/env:ro
      - ./logs:/var/log/workspace-infra
      - dev-data:/home/admin/.local
      - ssh-data:/home/admin/.ssh
      - /home/admin/.ssh/authorized_keys:/host-ssh/authorized_keys:ro
      - ./scripts/pull.sh:/usr/local/bin/pull:ro
      - ./scripts/workspace-infra-entrypoint.sh:/usr/local/bin/workspace-infra-entrypoint.sh:ro

  prod:
    build: .
    image: workspace-infra/prod:latest
    container_name: prod
    restart: unless-stopped
    network_mode: host
    environment:
      RUN_GIT_SYNC: "0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command: ["/bin/bash", "/usr/local/bin/prod-entrypoint.sh"]
    volumes:
      - work-data:/home/admin/work
      - ./logs:/var/log/workspace-infra
      - prod-data:/home/admin/.local
      - ssh-data:/home/admin/.ssh
      - /home/admin/.ssh/authorized_keys:/host-ssh/authorized_keys:ro
      - ./scripts/workspace-infra-entrypoint.sh:/usr/local/bin/workspace-infra-entrypoint.sh:ro
      - ./scripts/prod-entrypoint.sh:/usr/local/bin/prod-entrypoint.sh:ro
      - ./scripts/start-comfy.sh:/usr/local/bin/start-comfy:ro
    gpus: all

volumes:
  caddy_data:
    name: workspace_infra_caddy_data
  caddy_config:
    name: workspace_infra_caddy_config
  mongodb_data:
    name: workspace_infra_mongodb_data
  postgre_data:
    name: workspace_infra_postgre_data
  redis_data:
    name: workspace_infra_redis_data
  minio_data:
    name: workspace_infra_minio_data
  work-data:
    name: workspace_infra_work_data
  dev-data:
    name: workspace_infra_dev_data
  prod-data:
    name: workspace_infra_prod_data
  ssh-data:
    name: workspace_infra_ssh_data
