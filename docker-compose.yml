name: workspace-infra

services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mongodb:
    image: mongo:7
    container_name: mongo
    environment:
      MONGO_INITDB_DATABASE: workspace_infra
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1G
    networks:
      - dev-network

  dev:
    build: .
    image: workspace-infra/dev:latest
    container_name: dev
    restart: unless-stopped
    network_mode: host
    command: ["/usr/local/bin/workspace-infra-entrypoint.sh", "2201"]
    volumes:
      - work-data:/home/admin/work
      - dev-data:/home/admin/.local
      - ssh-data:/home/admin/.ssh

  prod:
    build: .
    image: workspace-infra/prod:latest
    container_name: prod
    restart: unless-stopped
    network_mode: host
    command: ["/usr/local/bin/workspace-infra-entrypoint.sh", "2202"]
    volumes:
      - work-data:/home/admin/work
      - prod-data:/home/admin/.local
      - ssh-data:/home/admin/.ssh
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all

volumes:
  caddy_data:
    name: workspace_infra_caddy_data
  caddy_config:
    name: workspace_infra_caddy_config
  mongodb_data:
    name: workspace_infra_mongodb_data
  dev-data:
    name: workspace_infra_dev_data
  prod-data:
    name: workspace_infra_prod_data
  work-data:
    name: workspace_infra_work_data
  ssh-data:
    name: workspace_infra_ssh_data

networks:
  dev-network:
    driver: bridge
